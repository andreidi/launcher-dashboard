<div class="flex min-h-screen items-start justify-center">
  <div
    class="mt-10 grid grid-cols-3 gap-8 gap-x-6 gap-y-10 px-4 py-10 sm:mt-0 sm:grid-cols-4 sm:gap-x-10 sm:gap-y-14 sm:px-6 sm:py-16 md:grid-cols-5 md:gap-x-12 md:gap-y-16 md:px-8 md:py-20 lg:grid-cols-6 lg:gap-x-16 lg:gap-y-20 lg:px-8 lg:py-20 xl:grid-cols-7"
  >
    @for (item of items(); track item.name) {
      <app-item [data]="item" (clicked)="open(item.url, $event)" />
    }
  </div>
</div>
